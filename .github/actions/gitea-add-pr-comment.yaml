name: "Gitea Add PR Comment"
description: "Post a comment on a Gitea pull request"

inputs:
  message:
    description: "Comment body (plain text or Markdown)"
    required: true
  gitea-url:
    description: "Base URL of your Gitea instance (e.g. https://git.example.com)"
    required: false
    default: ${{ github.server_url }}
  token:
    description: "Gitea API token with write:issue scope"
    required: true
  repo:
    description: "owner/repo — defaults to the current repository"
    required: false
    default: ${{ github.repository }}
  pr-number:
    description: "PR number — defaults to the PR that triggered this run"
    required: false
    default: ${{ github.event.pull_request.number }}

outputs:
  comment-id:
    description: "ID of the created comment"
    value: ${{ steps.post.outputs.comment-id }}

runs:
  using: "composite"
  steps:
    - name: Post comment
      id: post
      shell: bash
      env:
        GITEA_URL: ${{ inputs.gitea-url }}
        TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        COMMENT_ID=$(curl -fsSL \
          -X POST \
          -H "Authorization: token ${TOKEN}" \
          -H "Content-Type: application/json" \
          "${GITEA_URL%/}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --data-raw "$(jq -cn --arg body "$MESSAGE" '{body: $body}')" \
          | jq -r '.id')

        echo "comment-id=${COMMENT_ID}" >> "$GITHUB_OUTPUT"
        echo "Posted comment ID: ${COMMENT_ID}"
