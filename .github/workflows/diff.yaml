name: flux-local diff
on:
  push:
    branches-ignore: ["main"]

jobs:
  diff:
    name: flux diff
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: main
      - name: Checkout PR
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          path: pr

      - name: Run flux-local ks diff
        run: |
          flux-local diff ks \
            --path /workspace/${{github.repository}}/pr/k8s/flux \
            --path-orig /workspace/${{github.repository}}/main/k8s/flux \
            --all-namespaces \
            --output-file ks.diff
      - name: Run flux-local hr diff
        run: |
          flux-local diff hr \
            --path /workspace/${{github.repository}}/pr/k8s/flux \
            --path-orig /workspace/${{github.repository}}/main/k8s/flux \
            --all-namespaces \
            --output-file hr.diff
      - name: diff
        id: diff
        run: |
          # merge the 2 diff files
          cat hr.diff >> ks.diff

          # Message formatting based on diff

          {
            echo "diff<<EOF"
            if [[ -s "ks.diff" ]]; then
            echo "Here is the diff to main:"
            echo "\`\`\`diff"
            cat ks.diff
            echo "\`\`\`"
            else
              echo "No diff to main detected."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post comment
        run: |
          set -euo pipefail
          echo ${{ github.event }}
          COMMENT_ID=$(curl -fsSL \
            -X POST -v \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --data-raw "$(jq -cn --arg body "${{ steps.diff.outputs.diff }}" '{body: $body}')" \
            | jq -r '.id')

          echo "Posted comment ID: ${COMMENT_ID}"
