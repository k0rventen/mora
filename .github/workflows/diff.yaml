name: flux-local diff
permissions:
  contents: read
on:
  push:
    branches-ignore: ["main"]

jobs:
  diff:
    name: flux diff
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: main
      - name: Checkout PR
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          path: pr

      - name: Run flux-local ks diff
        run: |
          flux-local diff ks \
            --path /workspace/${{github.repository}}/pr/k8s/flux \
            --path-orig /workspace/${{github.repository}}/main/k8s/flux \
            --all-namespaces \
            --output-file ks.diff
      - name: Run flux-local hr diff
        run: |
          flux-local diff hr \
            --path /workspace/${{github.repository}}/pr/k8s/flux \
            --path-orig /workspace/${{github.repository}}/main/k8s/flux \
            --all-namespaces \
            --output-file hr.diff
      - name: diff
        id: diff
        run: |
          # merge the 2 diff files
          cat hr.diff >> ks.diff

          # Message formatting based on diff

          {
            echo "diff<<EOF"
            if [[ -s "ks.diff" ]]; then
            echo "Here is the diff to main:"
            echo "\`\`\`diff"
            cat ks.diff
            echo "\`\`\`"
            else
              echo "No diff to main detected."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post comment
        env:
          GITEA_URL: ${{ github.server_url }}
          TOKEN: ${{ secrets.COMMENT_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MESSAGE: ${{ steps.diff.outputs.diff }}
        run: |
          set -euo pipefail

          COMMENT_ID=$(curl -fsSL \
            -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "Content-Type: application/json" \
            "${GITEA_URL%/}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --data-raw "$(jq -cn --arg body "$MESSAGE" '{body: $body}')" \
            | jq -r '.id')

          echo "Posted comment ID: ${COMMENT_ID}"
