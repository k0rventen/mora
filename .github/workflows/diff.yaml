name: flux-local diff
permissions:
  contents: read
on:
  push:
    branches-ignore: ["main"]

jobs:
  diff:
    name: flux diff
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: main
      - name: Checkout PR
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6
        with:
          path: pr

      - name: Run flux-local ks diff
        run: |
          flux-local diff ks \
            --path /workspace/${{github.repository}}/pr/k8s/flux \
            --path-orig /workspace/${{github.repository}}/main/k8s/flux \
            --all-namespaces \
            --output-file ks.diff
      - name: Run flux-local hr diff
        run: |
          flux-local diff hr
            --path /workspace/${{github.repository}}/pr/k8s/flux
            --path-orig /workspace/${{github.repository}}/main/k8s/flux
            --all-namespaces
            --output-file hr.diff
      - name: diff
        id: diff
        run: |
          # merge the 2 diff files
          cat hr.diff >> ks.diff

          # Message formatting based on diff

          {
            echo "diff<<EOF"
            if [[ -s "ks.diff" ]]; then
            echo "Here is the diff to main:"
            echo "\`\`\`diff"
            cat ks.diff
            echo "\`\`\`"
            else
              echo "No diff to main detected."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Add Comment
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc
        with:
          message: |
            ${{ steps.diff.outputs.diff }}
