apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 10m
  chart:
    spec:
      chart: appchart
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: appchart
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: memos
        image: ghcr.io/usememos/memos:0.28.0
        volumeMounts:
          - name: memos-data
            mountPath: /var/opt/memos
        volumes:
          - name: memos-data
            persistentVolumeClaim:
              claimName: memos-data
        service: 5230
        ingress:
          domain: memos.cocointhe.cloud
          public: true
        pvc:
          - memos-data
