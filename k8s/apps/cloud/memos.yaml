apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 10m
  chart:
    spec:
      chart: appchart
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: appchart
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: memos
        image: ghcr.io/usememos/memos:0.29.0@sha256:471bd5dab62d59944644e177c366a44a6639584bffa7cacd72ca4d16f53f9a6d
        env:
        - name: MEMOS_PORT
          value: "8081"
        volumeMounts:
          - name: memos-data
            mountPath: /var/opt/memos
        volumes:
          - name: memos-data
            persistentVolumeClaim:
              claimName: memos-data
        service: 8081
        ingress:
          domain: memos.cocointhe.cloud
          public: true
        pvc:
          - memos-data
