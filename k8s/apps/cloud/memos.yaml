apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 10m
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: memos
        image: ghcr.io/usememos/memos:0.29.1@sha256:3e1253477066eb2aefa91145f7f9038bb931ed88c8a3ee05310a933594cdba7d
        env:
          - name: MEMOS_PORT
            value: "8081"
        volumeMounts:
          - name: memos-data
            mountPath: /var/opt/memos
        volumes:
          - name: memos-data
            persistentVolumeClaim:
              claimName: memos-data
        service: 8081
        ingress:
          domain: memos.cocointhe.cloud
          public: true
        pvc:
          - memos-data
