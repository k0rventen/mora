apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: audiomuse-ai
spec:
  interval: 24h
  url: https://NeptuneHub.github.io/AudioMuse-AI-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse-ai
spec:
  interval: 10m
  chart:
    spec:
      chart: audiomuse-ai
      version: "1.1.6"
      sourceRef:
        kind: HelmRepository
        name: audiomuse-ai
      interval: 24h
  values:
    image:
      pullPolicy: IfNotPresent
      tag: "2.1.4"
    timezone: "Europe/Rome"
    flask:
      service:
        type: ClusterIP
    ingress:
      enabled: true
      className: traefik
      hosts:
        - host: audiomuse.cocointhe.cloud
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - audiomuse.cocointhe.cloud
