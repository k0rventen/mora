apiVersion: v1
kind: Service
metadata:
  name: copainflix-upstream
spec:
  type: ExternalName
  externalName: copainflix.ibenyahia.fr
  ports:
    - name: https
      port: 443
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rewrite-copainflix-host-header
spec:
  headers:
    customRequestHeaders:
      Host: copainflix.ibenyahia.fr
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copainflix-upstream
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/router.middlewares: media-rewrite-copainflix-host-header@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: copainflix.cocointhe.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: copainflix-upstream
            port:
              number: 443
  tls:
  - hosts:
    - copainflix.cocointhe.cloud
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copainflix-upstream-tunnel
  labels:
    cocointhe.cloud/geoblock-disabled: ""
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/router.middlewares: media-rewrite-copainflix-host-header@kubernetescrd
spec:
  ingressClassName: traefik-tunnel
  rules:
  - host: copainflix.cocointhe.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: copainflix-upstream
            port:
              number: 443
  tls:
  - hosts:
    - copainflix.cocointhe.cloud
