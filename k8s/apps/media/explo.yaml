
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: explo
spec:
  interval: 10m
  chart:
    spec:
      chart: appchart
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: appchart
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: explo
        image: ghcr.io/lumepart/explo:v1.1.0@sha256:31b08b4693b412d08fadbc67dfa3a3e8c723bcf533ae34c7edd0dde2cf3431b9
        env:
        - name: EXECUTE_ON_START
          value: "true"
        - name: WEB_UI
          value: "true"
        - name: UI_USERNAME
          value: "testuser"
        - name: UI_PASSWORD
          value: "testpassword"
        volumeMounts:
          - name: jellyfin-music
            mountPath: /data
          - name: explo-data
            mountPath: /opt/explo/config
          - name: explo-config
            mountPath: /opt/explo/.env
            subPath: .env
        volumes:
          - name: jellyfin-music
            persistentVolumeClaim:
              claimName: jellyfin-music
          - name: explo-data
            persistentVolumeClaim:
              claimName: explo-data
          - name: explo-config
            secret:
              secretName: explo-config
        service: 7288
        ingress:
          domain: explo.cocointhe.cloud
        pvc:
          - explo-data