apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: joal
spec:
  interval: 10m
  chart:
    spec:
      chart: appchart
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: appchart
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: joal
        image: anthonyraymond/joal:2.1.37
        args:
          - --joal-conf=/data
          - --spring.main.web-environment=true
          - --server.port=9000
          - --joal.ui.path.prefix=joal
          - --joal.ui.secret-token=MRvqXT0qiGjHe51h
        volumeMounts:
          - mountPath: /data
            name: data
        volumes:
          - name: data
            persistentVolumeClaim:
              claimName: joal-data
        service: 9000
        ingress:
          domain: joal.cocointhe.cloud
        pvc:
          - joal-data
