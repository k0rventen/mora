apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  interval: 10m
  chart:
    spec:
      chart: appchart
      version: "1.8.0"
      sourceRef:
        kind: HelmRepository
        name: appchart
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: qbittorrent
        image: linuxserver/qbittorrent:5.2.1
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
        volumeMounts:
          - name: jellyfin-shows
            mountPath: /downloads
          - name: qbittorrent-config
            mountPath: /config
        volumes:
          - name: jellyfin-shows
            persistentVolumeClaim:
              claimName: jellyfin-shows
          - name: qbittorrent-config
            persistentVolumeClaim:
              claimName: qbittorrent-config
        service: 8080
        ingress:
          domain: torrents.cocointhe.cloud
        pvc:
          - qbittorrent-config
