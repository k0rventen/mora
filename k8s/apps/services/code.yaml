apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vscode
spec:
  interval: 24h
  chart:
    spec:
      chart: ./appchart/charts/appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 1h
  values:
    apps:
      - name: vscode-oauth2
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
        service: 4180
        ingress:
          domain: code.cocointhe.cloud
        containerSpec:
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://pocketid.cocointhe.cloud
            - --redirect-url=https://code.cocointhe.cloud/oauth2/callback
            - --upstream=http://vscode:9069
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --email-domain=*
            - --skip-provider-button=true
            - --reverse-proxy=true
            - --insecure-oidc-allow-unverified-email=true
            - --code-challenge-method=S256
            - --scope="openid email profile groups"
            - --cookie-name=__Host-oauth2-proxy
            - --cookie-csrf-per-request=true
          envFrom:
            - secretRef:
                name: oauth2-proxy-secret

      - name: vscode
        image: gitea.cocointhe.cloud/coco/code:v1
        containerSpec:
          securityContext:
            privileged: true
        service: 9069
        volumeMounts:
          - name: code-brew
            mountPath: /home/linuxbrew
          - name: code-home
            mountPath: /root
          - name: code-docker
            mountPath: /var/lib/docker
        volumes:
          - name: code-brew
            persistentVolumeClaim:
              claimName: code-brew
          - name: code-home
            persistentVolumeClaim:
              claimName: code-home
          - name: code-docker
            persistentVolumeClaim:
              claimName: code-docker
        pvc:
          - code-brew
          - code-home
          - code-docker
