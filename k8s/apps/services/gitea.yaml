apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  interval: 24h
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: gitea
        image: gitea/gitea:1.27.1-rootless@sha256:36cce26be71609091e1236d5b5de2c66a81fb8a7d45756a5fd3b7a28c11733b7
        service: 3000
        deploymentSpec:
          strategy:
            type: Recreate
        ingress:
          domain: gitea.cocointhe.cloud
        env:
          - name: GITEA__server__SSH_DOMAIN
            value: gitea.cocointhe.cloud
          - name: GITEA__server__SSH_PORT
            value: "2222"
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-ci-token
                key: token
        pvc:
          - gitea-data
          - gitea-conf
        volumeMounts:
          - name: gitea-data
            mountPath: /var/lib/gitea
          - name: gitea-conf
            mountPath: /etc/gitea
        volumes:
          - name: gitea-data
            persistentVolumeClaim:
              claimName: gitea-data
          - name: gitea-conf
            persistentVolumeClaim:
              claimName: gitea-conf
      - name: runner
        image: gitea/act_runner:0.6.1-dind-rootless@sha256:6b8f7c4297c0a5c4c181e4737665d4af69288cdc380e2887105a05a2b78930df
        volumeMounts:
          - name: docker-daemon-config
            mountPath: /etc/docker/daemon.json
            subPath: daemon.json
          - name: docker-config
            mountPath: /home/rootless/.docker/config.json
            subPath: config.json
        volumes:
          - name: docker-daemon-config
            configMap:
              name: docker-daemon-dns
          - name: docker-config
            secret:
              secretName: docker-config
        env:
          - name: GITEA_INSTANCE_URL
            value: "https://gitea.cocointhe.cloud"
          - name: GITEA_RUNNER_LABELS
            value: "ubuntu-latest:docker://gitea.cocointhe.cloud/coco/ci-runner" # lighter image with only git npm and docker
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-ci-token
                key: token
        containerSpec:
          securityContext:
            privileged: true
---
# fix the dns config of the DinD runner
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-daemon-dns
data:
  daemon.json: |
    {"dns": ["192.168.1.10"]}
---
# open another tcp port for git ssh access
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gitea-ssh
  name: gitea-ssh
spec:
  ports:
    - name: gitea-ssh
      port: 2222
      protocol: TCP
      targetPort: 2222
  selector:
    app: gitea
  type: LoadBalancer
