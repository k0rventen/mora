apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
spec:
  interval: 24h
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: gitea
        image: gitea/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
        service: 3000
        deploymentSpec:
          strategy:
            type: Recreate
        ingress:
          domain: gitea.cocointhe.cloud
        env:
          - name: GITEA__server__SSH_DOMAIN
            value: gitea.cocointhe.cloud
          - name: GITEA__server__SSH_PORT
            value: "2222"
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-ci-token
                key: token
        pvc:
          - gitea-data
          - gitea-conf
        volumeMounts:
          - name: gitea-data
            mountPath: /var/lib/gitea
          - name: gitea-conf
            mountPath: /etc/gitea
        volumes:
          - name: gitea-data
            persistentVolumeClaim:
              claimName: gitea-data
          - name: gitea-conf
            persistentVolumeClaim:
              claimName: gitea-conf
      - name: runner
        image: ghcr.io/vegardit/gitea-act-runner:dind-4.0.1@sha256:c62bfab5254ee8bb2e750150356b60ee0922ebb75321a52ce67982d7762c4582
        volumeMounts:
          - name: docker-daemon-config
            mountPath: /etc/docker/daemon.json
            subPath: daemon.json
          # - name: runner-docker-config
          #   mountPath: /home/rootless/.docker/config.json
          #   subPath: config.json
          - name: gitea-runner-data
            mountPath: /data
        volumes:
          - name: docker-daemon-config
            configMap:
              name: docker-daemon-dns
          - name: runner-docker-config
            secret:
              secretName: runner-docker-config
          - name: gitea-runner-data
            persistentVolumeClaim:
              claimName: gitea-runner-data
        env:
          - name: GITEA_INSTANCE_URL
            value: "https://gitea.cocointhe.cloud"
          - name: GITEA_RUNNER_LABELS
            value: "ubuntu-latest:docker://gitea.cocointhe.cloud/coco/ci-runner:latest" # custom image with everything needed for most pipelines
          - name: GITEA_RUNNER_REGISTRATION_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitea-ci-token
                key: token
        containerSpec:
          securityContext:
            privileged: true
        pvc:
          - gitea-runner-data
---
# fix the dns config of the DinD runner
apiVersion: v1
kind: ConfigMap
metadata:
  name: docker-daemon-dns
data:
  daemon.json: |
    {"dns": ["192.168.1.10"]}
---
# open another tcp port for git ssh access
apiVersion: v1
kind: Service
metadata:
  labels:
    app: gitea-ssh
  name: gitea-ssh
spec:
  ports:
    - name: gitea-ssh
      port: 2222
      protocol: TCP
      targetPort: 2222
  selector:
    app: gitea
  type: LoadBalancer
