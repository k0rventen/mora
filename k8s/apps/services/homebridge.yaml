apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebridge
spec:
  interval: 1h
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: homebridge
        podSpec:
          hostNetwork: true
        image: homebridge/homebridge:2026-07-31@sha256:d4f3579fc09c8d43d6956c8c970351f510096b9d990c53280d2c27c1e77bfbef
        volumeMounts:
          - name: homebridge-data
            mountPath: /homebridge
        volumes:
          - name: homebridge-data
            persistentVolumeClaim:
              claimName: homebridge-data
        service: 8581
        ingress:
          domain: homebridge.cocointhe.cloud
        pvc:
          - homebridge-data
