apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebridge
spec:
  interval: 1h
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: homebridge
        podSpec:
          hostNetwork: true
        image: homebridge/homebridge:2026-07-31@sha256:d4f3579fc09c8d43d6956c8c970351f510096b9d990c53280d2c27c1e77bfbef
        volumeMounts:
          - name: homebridge-data
            mountPath: /homebridge
        volumes:
          - name: homebridge-data
            persistentVolumeClaim:
              claimName: homebridge-data
        service: 8581
        ingress:
          domain: homebridge.cocointhe.cloud
        pvc:
          - homebridge-data
      - name: motion
        image: gitea.cocointhe.cloud/coco/motion:v0.2.0@sha256:dfcc2b5ba5cd8b4338941de2cdbbf7c3eac58fc482ebcc78087dbecbcfc3625a
        containerSpec:
          imagePullPolicy: Always
        volumeMounts:
          - name: motion-data
            mountPath: /data
        volumes:
          - name: motion-data
            persistentVolumeClaim:
              claimName: filebrowser-data
      - name: mqtt
        image: eclipse-mosquitto:alpine@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
---
# LB svc for mqtt
apiVersion: v1
kind: Service
metadata:
  name: mqtt
spec:
  ports:
  - port: 1883
    protocol: TCP
    targetPort: 1883
  selector:
    app: mqtt
  type: LoadBalancer
