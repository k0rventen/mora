apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "0 20 * * *"
  timeZone: "Europe/Paris"
  # suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          # volumes:
          #   - name: renovate-cache
          #     persistentVolumeClaim:
          #       claimName: renovate-cache
          containers:
            - name: renovate
              image: renovate/renovate:44.29.2@sha256:d0c00f5e19d0042c5a3e48c5fb949bd6ce3ea4f687cb4880370cb246082d1902
              args:
                - coco/cluster
              envFrom:
                - secretRef:
                    name: renovate-env
              # volumeMounts:
              # - mountPath: "/tmp/renovate"
              #   name: renovate-cache
          restartPolicy: Never

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
