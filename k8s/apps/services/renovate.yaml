apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "0 20 * * *"
  timeZone: "Europe/Paris"
  # suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          # volumes:
          #   - name: renovate-cache
          #     persistentVolumeClaim:
          #       claimName: renovate-cache
          containers:
            - name: renovate
              image: renovate/renovate:43.264.2@sha256:062bec49857f0b23232e09fc9a557b3abf71dd499dbf54c2137a83d9c6320795
              args:
                - coco/cluster
              envFrom:
                - secretRef:
                    name: renovate-env
              # volumeMounts:
              # - mountPath: "/tmp/renovate"
              #   name: renovate-cache
          restartPolicy: Never

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
