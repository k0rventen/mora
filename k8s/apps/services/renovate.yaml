apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
spec:
  schedule: "0 20 * * *"
  timeZone: "Europe/Paris"
  # suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          # volumes:
          #   - name: renovate-cache
          #     persistentVolumeClaim:
          #       claimName: renovate-cache
          containers:
            - name: renovate
              image: renovate/renovate:44.89.1@sha256:54ae1abc5c61702727a452998e2eb22d58e2dcd6de269f290caf3b7b6ab3238a
              args:
                - coco/cluster
              envFrom:
                - secretRef:
                    name: renovate-env
              # volumeMounts:
              # - mountPath: "/tmp/renovate"
              #   name: renovate-cache
          restartPolicy: Never

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: renovate-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
