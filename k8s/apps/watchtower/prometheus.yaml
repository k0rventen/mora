apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus
      version: "29.19.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus
      interval: 10m
  values:
    # when cleanup is required
    # server:
    #   extraFlags:
    #     - web.enable-admin-api
    scrapeConfigs:
      prometheus:
        enabled: false
      kubernetes-api-servers:
        enabled: false
      kubernetes-nodes:
        metric_relabel_configs: # useless series
          - source_labels: [__name__]
            regex: "apiserver_.*|etcd_.*|workqueue_.*|gotk_.*"
            action: drop
    prometheus-pushgateway:
      enabled: false
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: true
    prometheus-node-exporter:
      enabled: true
  valuesFrom:
    - kind: Secret
      name: prom-config
