# from https://github.com/hubblo-org/scaphandre/blob/main/helm/scaphandre/templates/daemonset.yaml as
# there is no proper helm chart
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scaphandre
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: scaphandre
  template:
    metadata:
      name: scaphandre
      labels:
        app: scaphandre
    spec:
      containers:
      - name:  scaphandre
        image: hubblo/scaphandre:1.0.3@sha256:9f1aa7017c56c6628f6f232ddab336cb1c64c165be179b3d4d3589cf5110dd8e
        args:
          - prometheus
        ports:
        - name: metrics
          containerPort: 8080
        securityContext:
          privileged: true

        volumeMounts:
        - mountPath: /sys/class/powercap
          name: powercap
          readOnly: true
      volumes:
      - hostPath:
          path: /sys/class/powercap
          type: "Directory"
        name: powercap
---
apiVersion: v1
kind: Service
metadata:
  name: scaphandre
spec:
  ports:
  - port: 8080
    name: metrics
    targetPort: metrics
  selector:
    app: scaphandre
