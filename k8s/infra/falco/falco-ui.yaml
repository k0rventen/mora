apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco-ui
spec:
  interval: 24h
  chart:
    spec:
      chart: ./appchart
      version: "x.x.x"
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      interval: 10m
  values:
    apps:
      - name: falco-ui
        image: falcosecurity/falcosidekick-ui:2.3.1
        env:
        - name: FALCOSIDEKICK_UI_DISABLEAUTH
          value: "true"
        - name: FALCOSIDEKICK_UI_REDIS_URL
          value: "falco-ui-redis:6379"
        service: 2802

      - name: falco-ui-redis
        image: redis:8.10.2-alpine
        service: 6379
        volumeMounts:
          - name: falco-ui-redis-data
            mountPath: /data
        volumes:
          - name: falco-ui-redis-data
            persistentVolumeClaim:
              claimName: falco-ui-redis-data
        pvc:
          - falco-ui-redis-data
