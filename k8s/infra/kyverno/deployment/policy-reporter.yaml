apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: policy-reporter
spec:
  interval: 24h
  url: https://kyverno.github.io/policy-reporter

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: policy-reporter
      version: "3.11.0"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
  values:
    ui:
      enabled: true
    plugin:
      kyverno:
        enabled: true
