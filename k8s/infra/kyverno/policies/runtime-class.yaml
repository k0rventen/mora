apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: gvisor-runtime-class
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
    objectSelector:
      matchLabels:
        secure-runtime-wanted: true
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: |
          Object{
            spec: Object.spec{
              runtimeClassName: "gvisor"
            }
          }
