apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: stakater
spec:
  interval: 24h
  url: https://stakater.github.io/stakater-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: reloader
      version: 2.2.16
      sourceRef:
        kind: HelmRepository
        name: stakater
      interval: 1h
  values:
    reloader:
      watchGlobally: false
      namespaces:
        - services
        - cloud
        - media
