apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 24h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 10m
  timeout: 5m
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: longhorn
      version: "1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 1h
  releaseName: longhorn
  values:
    preUpgradeChecker:
      jobEnabled: false
      upgradeVersionCheck: false
    longhornUI:
      replicas: 1
    longhornGlobalManager:
      replicas: 1
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    persistence:
      # -- Setting that allows you to specify the default Longhorn StorageClass.
      defaultClass: false
      reclaimPolicy: Retain
