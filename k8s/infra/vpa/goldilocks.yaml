apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds
spec:
  interval: 24h
  url: https://charts.fairwinds.com/stable
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: goldilocks
      version: v10.4.1
      sourceRef:
        kind: HelmRepository
        name: fairwinds
      interval: 1h
  values:
    dashboard:
      replicaCount: 1
